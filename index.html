<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f1117" />
    <title>DeBudget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── Navigation ── -->
      <nav class="nav">
        <div class="nav-inner">
          <button class="nav-tab active" data-tab="add" type="button">Добавить</button>
          <button class="nav-tab" data-tab="history" type="button">История</button>
          <button class="nav-tab" data-tab="stats" type="button">Статистика</button>
        </div>
      </nav>

      <!-- ══════════════ TAB: Добавить ══════════════ -->
      <div class="page tab-content active" id="tab-add">
        <header class="hero">
          <div class="brand"><h1>DeBudget</h1></div>
          <div class="hero-actions">
            <button id="exportBtn" class="ghost" type="button">Экспорт</button>
          </div>
        </header>

        <div class="grid">
          <section class="card">
            <h2>Новый расход</h2>
            <form id="generalForm" class="form">
              <label>
                Дата
                <input type="date" id="generalDate" required />
              </label>
              <label>
                Сумма
                <input
                  type="text"
                  id="generalAmount"
                  inputmode="decimal"
                  placeholder="0"
                  required
                  autocomplete="off"
                />
                <span id="amountHint" class="amount-hint"></span>
              </label>
              <label>
                Категория
                <!-- Наполняется из CATEGORIES в app.js -->
                <select id="generalCategory" required></select>
              </label>
              <label>
                Комментарий
                <input type="text" id="generalNote" placeholder="Необязательно" />
              </label>
              <button type="submit" class="primary">Добавить</button>
              <p class="hint" id="generalStatus" role="status" aria-live="polite"></p>
            </form>
          </section>
        </div>
      </div>

      <!-- ══════════════ TAB: История ══════════════ -->
      <div class="page tab-content" id="tab-history">
        <div class="history-header">
          <h1>История расходов</h1>
        </div>

        <div id="historyList" class="history-list">
          <div class="empty-state"><p>Расходов пока нет</p></div>
        </div>
      </div>

      <!-- ══════════════ TAB: Статистика ══════════════ -->
      <div class="page tab-content" id="tab-stats">
        <div class="stats-header">
          <h1>Статистика</h1>
          <div class="month-nav">
            <button id="prevMonth" class="month-btn" type="button" aria-label="Предыдущий месяц">&larr;</button>
            <span id="currentMonth" class="month-label"></span>
            <button id="nextMonth" class="month-btn" type="button" aria-label="Следующий месяц">&rarr;</button>
          </div>
        </div>

        <div class="stats-summary" id="statsSummary">
          <div class="stat-card">
            <p class="stat-value" id="statTotal">0</p>
            <p class="stat-label">Всего</p>
          </div>
          <div class="stat-card">
            <p class="stat-value stat-purple" id="statCount">0</p>
            <p class="stat-label">Записей</p>
          </div>
          <div class="stat-card stat-card-wide">
            <p class="stat-value" id="statAvgDay">0</p>
            <p class="stat-label">Среднее в день</p>
          </div>
        </div>

        <div class="card" id="categoriesCard">
          <h2>По категориям</h2>
          <div id="categoriesList" class="categories-list">
            <div class="empty-state"><p>Нет данных</p></div>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
